name: Release Windows

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - name: Verifica codice e versione
        run: |
          git ls-files '*.py' | ForEach-Object {
            python -m py_compile $_
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -c "import os, edgecam_gui_v41 as app; assert 'v' + app.VERSION == os.environ['GITHUB_REF_NAME']; assert app.normalize_search_name('PDJNL 2020') == app.normalize_search_name('pdjnl-2020') == app.normalize_search_name('PDJNL2020')"
      - name: Compila il pacchetto portatile
        run: python -m PyInstaller --clean --noconfirm --windowed --name EDGECAM-Tool edgecam_gui_v41.py
      - name: Crea e verifica l'archivio
        run: |
          $zip = "dist/EDGECAM-Tool-$env:GITHUB_REF_NAME-windows-x64.zip"
          Copy-Item README.md, CHANGELOG.md dist/EDGECAM-Tool
          if (!(Test-Path dist/EDGECAM-Tool/EDGECAM-Tool.exe -PathType Leaf)) { throw 'Eseguibile mancante' }
          Compress-Archive -Path dist/EDGECAM-Tool -DestinationPath $zip
          python -m zipfile -t $zip
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $heading = "# Versione $env:GITHUB_REF_NAME"
          $entries = (Get-Content CHANGELOG.md -Raw -Encoding utf8) -split '(?m)(?=^# Versione )'
          $notes = @($entries | Where-Object { ($_ -split '\r?\n', 2)[0] -ceq $heading })
          if ($notes.Count -ne 1) { throw "Note mancanti o duplicate per $heading" }
          $notes[0].Trim() | Set-Content build/release-notes.md -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist/EDGECAM-Tool-$env:GITHUB_REF_NAME-windows-x64.zip" --verify-tag --title "EDGECAM Tool $env:GITHUB_REF_NAME" --notes-file build/release-notes.md
